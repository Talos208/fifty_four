# replay サービス(fifty_four_lsp --replay)。shinasadame の Pod とは別の Pod にする。
# API キーはこの Pod だけが持つ。Secret `replay-keys` は手動で作る(README 参照)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: replay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: replay
  template:
    metadata:
      labels:
        app: replay
    spec:
      containers:
        - name: replay
          image: fifty-four-replay:latest
          # docker build したイメージを registry-mirror 経由で pull する
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: REPLAY_MAX_CONCURRENCY
              value: "4"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://signoz-otel-collector.signoz.svc.cluster.local:4317
          envFrom:
            - secretRef:
                name: replay-keys
                optional: true # 未作成でも起動する(その provider は auth エラーになる)
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
