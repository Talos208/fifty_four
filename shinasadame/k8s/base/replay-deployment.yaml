# replay サービス(fifty_four_lsp --replay)。shinasadame の Pod とは別の Pod にする。
# API キーは OpenBao から CSI 経由で取得し、Secret `replay-keys` に同期する(SecretProviderClass fifty-four-llm)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: replay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: replay
  template:
    metadata:
      labels:
        app: replay
    spec:
      serviceAccountName: replay
      containers:
        - name: replay
          image: fifty-four-replay:latest
          # docker build したイメージを registry-mirror 経由で pull する
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: REPLAY_MAX_CONCURRENCY
              value: "4"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://signoz-otel-collector.signoz.svc.cluster.local:4317
          envFrom:
            - secretRef:
                name: replay-keys # CSI が同期する。取得できなければ Pod は起動しない(optional にしない)
          volumeMounts:
            - name: llm-keys
              mountPath: /mnt/llm-keys # このマウントがあるときだけ replay-keys が同期される
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
      volumes:
        - name: llm-keys
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: fifty-four-llm
