# shinasadame と replay の「イメージをビルドして Pod を更新する」までを 1 コマンドにする。
#   skaffold run            # 1 回ビルド→デプロイ
#   skaffold dev            # ソース変更のたびに再ビルド→再デプロイ(終了時にデプロイしたものを削除する)
#   skaffold run -p web     # shinasadame だけ(重い Rust のビルドを避ける)
#   skaffold run -p replay  # replay だけ
# 手順の詳細は shinasadame/README.md の「Skaffold で更新する」。
#
# 注意: `dev` の終了時と `skaffold delete` は、デプロイしたリソース(namespace と PVC を含む)を
# 消す。デバッグ用途なので取り込み済みデータの消失は許容している。残したいときは
# `skaffold dev --cleanup=false` を使う。API キーは OpenBao から CSI で取得する(Driver は管理対象外。docs/openbao-csi/README.md)。
apiVersion: skaffold/v4beta11 # インストールした skaffold が古くて拒否されたら `skaffold fix` で直す
kind: Config
metadata:
  name: fifty-four

build:
  # 入力ファイルの内容から決まるタグ。コミット前の変更でもタグが変わるので、Pod が確実に作り直される
  # (gitCommit だと未コミット中は `<sha>-dirty` で固定され、再ビルドしても Pod が更新されない)。
  tagPolicy:
    inputDigest: {}
  local:
    push: false # レジストリへ push しない(registry-mirror 経由で pull する現在の運用のまま)
  artifacts:
    # マニフェストの `image: shinasadame:latest` が、ビルドしたタグに置き換わる
    - image: shinasadame
      context: shinasadame
      docker:
        dockerfile: Dockerfile
    # ビルドコンテキストはリポジトリルート(lsp/Dockerfile.replay が data/ や extension/ を必要とする)
    - image: fifty-four-replay
      context: .
      docker:
        dockerfile: lsp/Dockerfile.replay

manifests:
  kustomize:
    paths:
      - shinasadame/k8s

deploy:
  kubectl: {}

profiles:
  # 重い Rust イメージをビルドしない
  - name: web
    patches:
      - op: remove
        path: /build/artifacts/1
  # shinasadame(Python)のイメージをビルドしない
  - name: replay
    patches:
      - op: remove
        path: /build/artifacts/0
