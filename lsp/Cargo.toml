[package]
name = "fifty_four_lsp"
version = "0.1.0"
edition = "2024"

[features]
default = ["otel"]
release = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-stdout",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry"
]

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
async-trait = "0.1.89"
tower-lsp-server = "0.22"
agent-client-protocol = "2.0"
anthropic-agent-sdk = "0.2"
lindera = { version = "2.3.2", features = ["embed-ipadic"] }
log = "0.4.29"
env_logger = "0.11.9"
dashmap = "6.1"
dotenvx-rs = "0.4.30"
genai = "0.6.5"
indoc = "2.0.7"
serde_json = "1.0.149"
serde = "1.0.228"
strum = "0.28"
strum_macros = "0.28"
rusqlite = { version = "^0.37", features = ["bundled", "load_extension"] }
refinery = { version = "^0.9.0", features = ["default", "rusqlite"] }
time = { version = "0.3.5", features = ["parsing", "formatting"] }
regex = { version = "^1.12", features = ["default"] }
rust-embed = { version = "8.11.0", features = ["interpolate-folder-path", "compression"] }
farmhash = "1.1.5"
gray_matter = { version = "0.3.2", features = ["yaml"] }
parking_lot = { version = "0.12.4", features = ["deadlock_detection"] }
http = "1.4.0"
derive_more = { version = "2.1.1", features = ["error", "display"] }
bitflags = "2"
comrak = { version = "0.51.0", features = ["bon","syntect","shortcodes"] }
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
which = "8"

opentelemetry = { version = "0.31.0", optional = true }
opentelemetry_sdk = { version = "0.31.0", features = ["trace", "metrics", "logs"], optional = true }
opentelemetry-stdout = { version = "0.31.0", features = ["trace", "metrics", "logs"], optional = true }
opentelemetry-otlp = { version = "0.31.0", features = ["trace", "metrics", "logs", "grpc-tonic"], optional = true }
opentelemetry-appender-tracing = { version = "0.31.1", optional = true }
tracing = { version = "0.1.44", features = ["std"], optional = true }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "registry", "std", "fmt"], optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }
